<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			body { font-family: system-ui, sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
			.row { display: flex; align-items: center; margin: 6px 0; gap: 8px; }
			.row label { width: 110px; flex: none; color: #aaa; }
			.row input, .row select { flex: 1; min-width: 0; background: #2a2a2e; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; }
			.hint { color: #888; font-size: 12px; margin: 10px 0 0; }
			.warn { color: #d9a441; }
		</style>
		<script>
			const NAMES = ["ALT", "VS", "IAS", "HDG", "CRS"];
			// Metrics that easily exceed 3 digits; IAS/HDG/CRS only show the last 3.
			const WIDE = ["RamUsedMb", "RamFreeMb", "GpuMemoryMb"];
			let update = () => {};

			function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
				actionInfo = JSON.parse(actionInfo);
				const ws = new WebSocket("ws://localhost:" + port);
				ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));

				const column = actionInfo.payload.coordinates?.column ?? -1;
				const onPanel = actionInfo.device.startsWith("pz-") && column >= 0 && column <= 4;
				const threeDigits = onPanel && column >= 2;
				document.getElementById("dial").innerText = onPanel
					? `Shown on the panel display when the selector is on ${column < 2 ? "ALT or VS" : NAMES[column]}. Only updates while shown.`
					: "Not on a Multi Panel knob dial: value only shown as the dial title.";
				if (!(onPanel && column <= 1)) document.getElementById("row-setting").style.display = "none";
				document.getElementById("row-default").innerText = `Default (${column === 1 ? "lower" : "upper"})`;

				const metric = document.getElementById("metric");
				const interval = document.getElementById("interval");
				const row = document.getElementById("row");
				const warn = () => {
					document.getElementById("warn").style.display = threeDigits && WIDE.includes(metric.value) ? "block" : "none";
				};

				const s = actionInfo.payload.settings ?? {};
				metric.value = s.metric ?? "CpuPercent";
				interval.value = s.interval ?? "";
				row.value = s.row ?? "";
				warn();

				update = () => {
					const out = { metric: metric.value };
					const ms = parseInt(interval.value, 10);
					if (!isNaN(ms)) out.interval = ms;
					if (row.value) out.row = row.value;
					warn();
					ws.send(JSON.stringify({ event: "setSettings", context: actionInfo.context, payload: out }));
				};
			}
		</script>
	</head>
	<body>
		<p class="hint" id="dial"></p>
		<div class="row">
			<label for="metric">Show</label>
			<select id="metric" onchange="update()">
				<option value="CpuPercent">CPU load %</option>
				<option value="RamPercent">RAM used %</option>
				<option value="RamUsedMb">RAM used MB</option>
				<option value="RamUsedGb">RAM used GB</option>
				<option value="RamFreeMb">RAM free MB</option>
				<option value="RamFreeGb">RAM free GB</option>
				<option value="GpuPercent">GPU load %</option>
				<option value="GpuMemoryMb">GPU memory used MB</option>
			</select>
		</div>
		<div class="row"><label for="interval">Update every (ms)</label><input id="interval" type="number" min="250" step="250" placeholder="1000" oninput="update()" /></div>
		<div class="row" id="row-setting">
			<label for="row">Display row</label>
			<select id="row" onchange="update()"><option value="" id="row-default"></option><option value="upper">Upper</option><option value="lower">Lower</option></select>
		</div>
		<p class="hint warn" id="warn" style="display: none">This position only shows 3 digits; values over 999 get cut off. Use a GB or % metric, or put it on the ALT/VS dial.</p>
	</body>
</html>
