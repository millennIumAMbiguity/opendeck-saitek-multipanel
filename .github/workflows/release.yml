name: Release

# Push a tag like v0.1.0 (must match "Version" in the manifest) to build native Windows and Linux
# binaries and publish <id>.sdPlugin.zip as a GitHub release, which is what OpenDeck installs from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN: io.github.millenniumambiguity.saitekmultipanel.sdPlugin
  PROJECT: src/SaitekMultiPanel/SaitekMultiPanel.csproj

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish (Native AOT)
        run: dotnet publish ${{ env.PROJECT }} -c Release -r ${{ matrix.rid }} -o out
      - name: Drop debug symbols
        shell: bash
        run: find out \( -name '*.pdb' -o -name '*.dbg' \) -delete
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: out

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .Version "plugin/$PLUGIN/manifest.json")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest Version $version"; exit 1
          fi
      - name: Package
        run: |
          mkdir -p "dist/$PLUGIN/bin"
          cp -r "plugin/$PLUGIN/." "dist/$PLUGIN/"
          cp -r binaries/win-x64 "dist/$PLUGIN/bin/win-x64"
          cp -r binaries/linux-x64 "dist/$PLUGIN/bin/linux-x64"
          chmod +x "dist/$PLUGIN/bin/linux-x64/saitek-multipanel"
          (cd dist && zip -r "../$PLUGIN.zip" "$PLUGIN")
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ env.PLUGIN }}.zip
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: ${{ env.PLUGIN }}
          path: ${{ env.PLUGIN }}.zip
